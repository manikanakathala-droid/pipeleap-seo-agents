name: Growth Loop

# MEASURE -> LEARN -> PLAN -> ACT -> REPORT against the repository that serves www.pipeleap.com.
#
# Secrets (all optional; the loop reports what it cannot see instead of failing):
#   GSC_SERVICE_ACCOUNT_JSON  Search Console + GA4 read access. Without it the loop runs blind and caps itself.
#   SITE_DEPLOY_TOKEN         Fine-grained PAT with contents:write on the site repository. Without it,
#                             site changes are attached to the run as a patch instead of being pushed.
#   MAIL_*                    Briefing email.
# Repository variable:
#   GROWTH_PUBLISH_MODE       "branch" (default): push site changes to the growth-loop branch for review.
#                             "direct": push to the site's main branch, which deploys to production.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and report only; change nothing"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: growth-loop
  cancel-in-progress: false

env:
  SITE_REPO: manikanakathala-droid/Pipeleap-web-redesign
  PUBLISH_MODE: ${{ vars.GROWTH_PUBLISH_MODE || 'branch' }}

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Check out the live site's source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SITE_REPO }}
          path: site
          token: ${{ secrets.SITE_DEPLOY_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-growth.txt

      - run: pip install -r requirements-growth.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Run the loop
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p credentials
            printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > credentials/gsc_service_account.json
          fi
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python run_growth_loop.py --site-dir site $FLAGS | tee briefing.out
          cat briefing.out >> "$GITHUB_STEP_SUMMARY"

      - name: Save what the loop learned
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Pipeleap Growth Loop"
          git config user.email "growth-loop@users.noreply.github.com"
          git add growth_state
          if git diff --cached --quiet; then echo "No state changes."; exit 0; fi
          git commit -m "growth: run ${{ github.run_number }}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish site changes
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          HAS_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN != '' }}
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Site already up to date."; echo "pushed=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --cached > ../site-changes.patch
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::SITE_DEPLOY_TOKEN is not set. Site changes are attached as site-changes.patch and were not pushed."
            echo "pushed=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "Pipeleap Growth Loop"
          git config user.email "growth-loop@users.noreply.github.com"
          if [ "$PUBLISH_MODE" = "direct" ]; then
            git commit -m "Growth loop: search foundation and resources"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=main" >> "$GITHUB_OUTPUT"
          else
            git checkout -B growth-loop
            git commit -m "Growth loop: search foundation and resources"
            git push --force origin growth-loop
            echo "pushed=branch" >> "$GITHUB_OUTPUT"
            echo "Site changes are on the growth-loop branch of $SITE_REPO, waiting to be merged." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tell search engines what changed
        if: steps.publish.outputs.pushed == 'main'
        run: |
          sleep 120   # let the deployment finish
          python run_growth_loop.py --ping
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: growth-loop-${{ github.run_id }}
          path: |
            growth_state/briefing.md
            growth_state/report.json
            site-changes.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Email the briefing
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from pathlib import Path
          if not os.environ.get("MAIL_SERVER"):
              raise SystemExit("Mail is not configured; skipping.")
          path = Path("growth_state/briefing.md")
          body = path.read_text(encoding="utf-8") if path.exists() else "The loop did not produce a briefing. Check the run log."
          headline = next((l.strip("* ") for l in body.splitlines() if l.startswith("**")), os.environ["JOB_STATUS"])
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = f"Pipeleap growth: {headline}"[:160]
          msg["From"] = f"Pipeleap Growth Loop <{os.environ['MAIL_USERNAME']}>"
          msg["To"] = os.environ["MAIL_TO"]
          with smtplib.SMTP(os.environ["MAIL_SERVER"], int(os.environ.get("MAIL_PORT") or 587)) as smtp:
              smtp.starttls(context=ssl.create_default_context())
              smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
              smtp.send_message(msg)
          PY
