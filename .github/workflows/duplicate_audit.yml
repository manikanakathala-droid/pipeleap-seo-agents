# RETIRED 2026-11-14: targets the pipeleap-launchpad repository, which no longer exists and no longer serves
# www.pipeleap.com. Schedules removed so it stops failing several times a day. Replaced by growth_loop.yml.
name: Duplicate File Audit

on:
  workflow_dispatch:

jobs:
  audit-duplicates:
    name: Audit duplicate files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run duplicate audit
        run: python scripts/audit_duplicates.py
